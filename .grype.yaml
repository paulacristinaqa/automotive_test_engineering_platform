  - vulnerability: CVE-2026-14456
    package:
      name: libcrypto3
      version: 3.5.7-r0
      type: apk
  - vulnerability: CVE-2026-14456
    package:
      name: libssl3
      version: 3.5.7-r0
      type: apk
