# ATEP time-bounded vulnerability exceptions.
# Owner: ATEP maintainers
# Review-by: 2026-09-05
# Upstream stable fixes: unavailable for the entries below as of 2026-08-24.
# Scope: exact package/version/type and exact CVE. Every other high/critical finding remains blocking.
ignore:
  - vulnerability: CVE-2026-11940
    package:
      name: python
      version: 3.14.6
      type: binary
  - vulnerability: CVE-2026-15308
    package:
      name: python
      version: 3.14.6
      type: binary
  - vulnerability: CVE-2026-11972
    package:
      name: python
      version: 3.14.6
      type: binary
