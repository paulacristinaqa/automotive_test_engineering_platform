name: reusable-release-builder

on:
  workflow_call:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  build-publish-attest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE_NAME: ghcr.io/paulacristinaqa/automotive_test_engineering_platform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable builder identity and source
        env:
          BUILDER_WORKFLOW_REF: ${{ job.workflow_ref }}
        run: |
          test "$BUILDER_WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/reusable-release-builder.yml@refs/heads/main"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Authenticate to GHCR with the job token
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Reject replacement of an existing commit tag
        run: |
          if docker buildx imagetools inspect "$IMAGE_NAME:sha-$GITHUB_SHA" >/dev/null 2>&1; then
            echo "The immutable commit tag already exists; refusing replacement." >&2
            exit 1
          fi
      - name: Build and publish the immutable image
        id: image
        run: |
          docker buildx build \
            --push \
            --provenance=false \
            --build-arg "ATEP_SOURCE_REVISION=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$IMAGE_NAME:sha-$GITHUB_SHA" \
            --metadata-file image-metadata.json \
            .
          DIGEST="$(python -c "from pathlib import Path; from tools.build_release_evidence import read_image_digest; print(read_image_digest(Path('image-metadata.json')))" )"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Generate release image CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.IMAGE_NAME }}@${{ steps.image.outputs.digest }}
          format: cyclonedx-json
          output-file: atep-release-image.cdx.json
          artifact-name: atep-release-image-sbom-${{ github.sha }}
          upload-artifact-retention: 90
          upload-release-assets: false
      - name: Create signed build-provenance attestation
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Create signed SBOM attestation
        id: sbom-attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: atep-release-image.cdx.json
          push-to-registry: true
          create-storage-record: false
      - name: Build non-sensitive release evidence
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          PROVENANCE_URL: ${{ steps.provenance.outputs.attestation-url }}
          SBOM_ATTESTATION_URL: ${{ steps.sbom-attestation.outputs.attestation-url }}
        run: |
          python tools/build_release_evidence.py \
            --source-sha "$GITHUB_SHA" \
            --image-digest "$IMAGE_DIGEST" \
            --provenance-url "$PROVENANCE_URL" \
            --sbom-attestation-url "$SBOM_ATTESTATION_URL" \
            --output release-evidence.json
      - name: Download attestations and current trusted roots
        id: offline-evidence
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          BUNDLE_FILE="sha256:${IMAGE_DIGEST#sha256:}.jsonl"
          gh attestation download "oci://$IMAGE_NAME@$IMAGE_DIGEST" \
            --repo "$GITHUB_REPOSITORY" \
            --limit 30
          test -s "$BUNDLE_FILE"
          gh attestation trusted-root > trusted_root.jsonl
          test -s trusted_root.jsonl
          echo "bundle-file=$BUNDLE_FILE" >> "$GITHUB_OUTPUT"
      - name: Verify the archived provenance bundle
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          BUNDLE_FILE: ${{ steps.offline-evidence.outputs.bundle-file }}
        run: |
          gh attestation verify "oci://$IMAGE_NAME@$IMAGE_DIGEST" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "$BUNDLE_FILE" \
            --custom-trusted-root trusted_root.jsonl \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/reusable-release-builder.yml" \
            --source-digest "$GITHUB_SHA" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners
      - name: Build the offline archive manifest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          BUNDLE_FILE: ${{ steps.offline-evidence.outputs.bundle-file }}
        run: |
          python tools/build_release_archive_manifest.py \
            --source-sha "$GITHUB_SHA" \
            --image-digest "$IMAGE_DIGEST" \
            --release-evidence release-evidence.json \
            --sbom atep-release-image.cdx.json \
            --attestation-bundle "$BUNDLE_FILE" \
            --trusted-root trusted_root.jsonl \
            --output release-archive-manifest.json
      - name: Seal the deterministic archive object
        run: |
          python tools/seal_release_archive.py seal \
            --manifest release-archive-manifest.json \
            --output atep-release-evidence.zip \
            --receipt release-archive-receipt.json
      - name: Retain release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atep-release-evidence-${{ github.sha }}
          path: release-evidence.json
          if-no-files-found: error
          retention-days: 90
      - name: Retain portable offline-verification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atep-release-offline-archive-${{ github.sha }}
          path: |
            atep-release-evidence.zip
            release-archive-receipt.json
          if-no-files-found: error
          retention-days: 90
      - name: Remove registry credentials
        if: always()
        run: docker logout ghcr.io

  archive-restore-smoke:
    needs: build-publish-attest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the sealed archive through a fresh job boundary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: atep-release-offline-archive-${{ github.sha }}
          path: restored-transfer
      - name: Restore and verify the sealed evidence
        run: |
          python tools/seal_release_archive.py restore \
            --archive restored-transfer/atep-release-evidence.zip \
            --receipt restored-transfer/release-archive-receipt.json \
            --output-directory restored-release-evidence
          test -s restored-release-evidence/release-archive-manifest.json
