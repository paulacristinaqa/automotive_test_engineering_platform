name: integration

on:
  pull_request:
  push:
    branches: [main]

jobs:
  docker-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Run fast quality gates
        run: |
          python -m pytest
          python -m ruff check .
          python -m mypy src tests
      - name: Render Kubernetes deployment targets
        run: |
          kubectl kustomize deploy/kubernetes/foundation > /dev/null
          kubectl kustomize deploy/kubernetes/migration > /dev/null
          kubectl kustomize deploy/kubernetes/workloads > /dev/null
      - name: Generate ephemeral integration credentials
        shell: bash
        run: |
          echo "ATEP_INTEGRATION_DB_PASSWORD=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
          echo "ATEP_INTEGRATION_RABBITMQ_USER=atep-integration" >> "$GITHUB_ENV"
          echo "ATEP_INTEGRATION_RABBITMQ_PASSWORD=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
          echo "ATEP_INTEGRATION_JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "ATEP_INTEGRATION_ADMIN_EMAIL=integration-admin@atep.example.com" >> "$GITHUB_ENV"
          echo "ATEP_INTEGRATION_ADMIN_PASSWORD=Integration-$(openssl rand -hex 16)!" >> "$GITHUB_ENV"
          echo "ATEP_INTEGRATION_API_URL=http://localhost:18000" >> "$GITHUB_ENV"
          echo "ATEP_INTEGRATION_API_PORT=18000" >> "$GITHUB_ENV"
          echo "ATEP_INTEGRATION_POSTGRES_PORT=15432" >> "$GITHUB_ENV"
          echo "ATEP_INTEGRATION_RABBITMQ_PORT=15673" >> "$GITHUB_ENV"
          echo "ATEP_INTEGRATION_OUTBOX_METRICS_PORT=19101" >> "$GITHUB_ENV"
          echo "ATEP_INTEGRATION_OUTBOX_METRICS_URL=http://localhost:19101" >> "$GITHUB_ENV"
          echo "ATEP_ALERTMANAGER_PORT=19093" >> "$GITHUB_ENV"
          echo "ATEP_ALERT_WEBHOOK_PORT=19094" >> "$GITHUB_ENV"
      - name: Export dependency URLs
        shell: bash
        run: |
          echo "ATEP_INTEGRATION_DATABASE_URL=postgresql://atep:${ATEP_INTEGRATION_DB_PASSWORD}@localhost:15432/atep" >> "$GITHUB_ENV"
          echo "ATEP_INTEGRATION_RABBITMQ_URL=amqp://${ATEP_INTEGRATION_RABBITMQ_USER}:${ATEP_INTEGRATION_RABBITMQ_PASSWORD}@localhost:15673/" >> "$GITHUB_ENV"
      - name: Validate optional observability topology
        run: docker compose -f compose.integration.yaml -f compose.observability.yaml --profile observability config --quiet
      - name: Validate Prometheus configuration and alert rules
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/deploy/observability:/etc/prometheus:ro" \
            prom/prometheus:v3.13.2 check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint amtool \
            -v "$PWD/deploy/observability:/etc/alertmanager:ro" \
            prom/alertmanager:v0.33.1 check-config /etc/alertmanager/alertmanager.yml
      - name: Start disposable stack
        shell: bash
        run: |
          docker compose -p atep-integration -f compose.integration.yaml up --build -d
          for attempt in {1..90}; do
            if curl --fail --silent http://localhost:18000/health/ready > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Start local alert delivery services
        shell: bash
        run: |
          docker compose -p atep-integration \
            -f compose.integration.yaml \
            -f compose.observability.yaml \
            --profile observability \
            up --build -d --no-deps alert-webhook alertmanager
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:19093/-/ready > /dev/null \
              && curl --fail --silent http://localhost:19094/health/live > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Verify local alert delivery
        shell: bash
        run: |
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          curl --fail --silent \
            -H "Content-Type: application/json" \
            -d "[{\"labels\":{\"alertname\":\"AtepDeliveryProbe\",\"service\":\"atep-alerting\",\"severity\":\"critical\"},\"annotations\":{\"summary\":\"CI delivery probe\"},\"startsAt\":\"${started_at}\"}]" \
            http://localhost:19093/api/v2/alerts
          delivered=false
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:19094/metrics \
              | grep -q 'atep_alert_webhook_notifications_total{severity="critical",status="firing"} 1.0'; then
              delivered=true
              break
            fi
            sleep 1
          done
          if [ "$delivered" != true ]; then
            exit 1
          fi
          sleep 1
          ended_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          curl --fail --silent \
            -H "Content-Type: application/json" \
            -d "[{\"labels\":{\"alertname\":\"AtepDeliveryProbe\",\"service\":\"atep-alerting\",\"severity\":\"critical\"},\"annotations\":{\"summary\":\"CI delivery probe\"},\"startsAt\":\"${started_at}\",\"endsAt\":\"${ended_at}\"}]" \
            http://localhost:19093/api/v2/alerts
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:19094/metrics \
              | grep -q 'atep_alert_webhook_notifications_total{severity="critical",status="resolved"} 1.0'; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Run integration tests
        run: python -m pytest -p no:cacheprovider -o addopts= -m integration tests/integration
      - name: Quiesce application writers for restore evidence
        run: docker compose -p atep-integration -f compose.integration.yaml stop api outbox-worker
      - name: Exercise PostgreSQL logical backup and isolated restore
        run: |
          python tools/run_postgres_restore_drill.py \
            --compose-file compose.integration.yaml \
            --project-name atep-integration \
            --output-directory dr-evidence
      - name: Retain non-sensitive disaster-recovery evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atep-postgres-restore-drill
          path: dr-evidence/atep-dr-report.json
          if-no-files-found: error
          retention-days: 14
      - name: Show service logs on failure
        if: failure()
        run: docker compose -p atep-integration -f compose.integration.yaml -f compose.observability.yaml --profile observability logs --no-color --tail 200
      - name: Remove disposable stack
        if: always()
        run: docker compose -p atep-integration -f compose.integration.yaml -f compose.observability.yaml --profile observability down -v --remove-orphans
