name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-supply-chain:
    name: source-and-dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install hash-locked development environment
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Regenerate canonical Linux dependency locks
        run: |
          pip-compile --all-build-deps --allow-unsafe --generate-hashes --no-emit-index-url --no-emit-trusted-host --output-file=requirements.lock --strip-extras pyproject.toml
          pip-compile --all-build-deps --allow-unsafe --generate-hashes --no-emit-index-url --no-emit-trusted-host --extra=dev --output-file=requirements-dev.lock --strip-extras pyproject.toml
      - name: Retain canonical Linux dependency locks
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atep-canonical-linux-locks
          path: |
            requirements.lock
            requirements-dev.lock
          if-no-files-found: error
          retention-days: 7
      - name: Verify committed locks are current
        run: git diff --exit-code -- requirements.lock requirements-dev.lock
      - name: Audit Python dependencies and generate CycloneDX SBOM
        run: python -m pip_audit --require-hashes --disable-pip -r requirements.lock --progress-spinner off --format cyclonedx-json --output atep-python.cdx.json
      - name: Retain Python dependency SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atep-python-sbom
          path: atep-python.cdx.json
          if-no-files-found: error
          retention-days: 14

  codeql:
    name: codeql-python
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          languages: python
          queries: security-extended
      - name: Analyze Python
        uses: github/codeql-action/analyze@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          category: /language:python

  image-supply-chain:
    name: image-sbom-and-vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build pinned ATEP image
        run: docker build --tag atep-core:security .
      - name: Generate image CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: atep-core:security
          format: cyclonedx-json
          output-file: atep-image.cdx.json
          artifact-name: atep-image-sbom
          upload-artifact-retention: 14
          upload-release-assets: false
      - name: Fail on high or critical image vulnerabilities
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          sbom: atep-image.cdx.json
          fail-build: true
          severity-cutoff: high
          output-format: table
