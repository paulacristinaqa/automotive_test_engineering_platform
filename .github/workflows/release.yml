name: release-image

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atep-release-image
  cancel-in-progress: false

jobs:
  approve-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify protected release context
        env:
          ATEP_RELEASE_ENABLED: ${{ vars.ATEP_RELEASE_ENABLED }}
        run: |
          test "$ATEP_RELEASE_ENABLED" = "true"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  publish-attested-image:
    needs: approve-release
    uses: ./.github/workflows/reusable-release-builder.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
