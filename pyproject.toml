[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atep-core"
version = "0.1.0"
description = "Automotive Test Engineering Platform - Core Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aio-pika>=9.5,<10",
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "boto3>=1.43.49,<2",
  "fastapi>=0.115,<1",
  "pwdlib[argon2]>=0.2,<1",
  "email-validator>=2.2,<3",
  "opentelemetry-api>=1.37,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.37,<2",
  "opentelemetry-sdk>=1.37,<2",
  "pydantic-settings>=2.7,<3",
  "prometheus-client>=0.22,<1",
  "PyJWT>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "redis>=5.2,<6",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "structlog>=24.4,<26",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.14,<3",
  "pip-audit==2.10.1",
  "pip==26.2.1",
  "pip-tools==7.6.0",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.9,<1",
  "websockets>=15,<18",
]

[tool.hatch.build.targets.wheel]
packages = ["src/atep"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not integration'"
markers = [
  "integration: exercises the disposable Docker stack and external dependencies",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
