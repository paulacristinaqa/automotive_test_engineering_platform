global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: atep-core
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
  - job_name: atep-outbox-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["outbox-worker:9101"]
