groups:
  - name: atep-slo-recording
    interval: 30s
    rules:
      - record: atep:sli_http_error_ratio:rate5m
        expr: sum(rate(atep_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(atep_http_requests_total[5m])), 0.000001)
      - record: atep:sli_http_error_ratio:rate1h
        expr: sum(rate(atep_http_requests_total{status=~"5.."}[1h])) / clamp_min(sum(rate(atep_http_requests_total[1h])), 0.000001)
      - record: atep:sli_http_error_ratio:rate6h
        expr: sum(rate(atep_http_requests_total{status=~"5.."}[6h])) / clamp_min(sum(rate(atep_http_requests_total[6h])), 0.000001)
      - record: atep:sli_http_error_ratio:rate3d
        expr: sum(rate(atep_http_requests_total{status=~"5.."}[3d])) / clamp_min(sum(rate(atep_http_requests_total[3d])), 0.000001)
      - record: atep:sli_http_success_ratio:rate5m
        expr: 1 - atep:sli_http_error_ratio:rate5m
      - record: atep:sli_http_latency_p95_seconds:rate5m
        expr: histogram_quantile(0.95, sum by (le) (rate(atep_http_request_duration_seconds_bucket[5m])))

  - name: atep-alerts
    rules:
      - alert: AtepApiFastErrorBudgetBurn
        expr: atep:sli_http_error_ratio:rate5m > (14.4 * 0.001) and atep:sli_http_error_ratio:rate1h > (14.4 * 0.001)
        for: 5m
        labels:
          severity: critical
          service: atep-core
        annotations:
          summary: ATEP API is consuming its 99.9% availability error budget rapidly
          runbook_url: docs/observability.md#alert-response
      - alert: AtepApiSlowErrorBudgetBurn
        expr: atep:sli_http_error_ratio:rate6h > (1.0 * 0.001) and atep:sli_http_error_ratio:rate3d > (1.0 * 0.001)
        for: 30m
        labels:
          severity: warning
          service: atep-core
        annotations:
          summary: ATEP API is persistently consuming its 99.9% availability error budget
          runbook_url: docs/observability.md#alert-response
      - alert: AtepApiLatencyP95High
        expr: atep:sli_http_latency_p95_seconds:rate5m > 0.5
        for: 10m
        labels:
          severity: warning
          service: atep-core
        annotations:
          summary: ATEP API p95 latency is above the 500 ms objective
          runbook_url: docs/observability.md#alert-response
      - alert: AtepModuleUnavailable
        expr: atep_registered_modules{status="inactive"} > 0
        for: 2m
        labels:
          severity: critical
          service: atep-registry
        annotations:
          summary: One or more monitored ATEP modules are inactive
          runbook_url: docs/observability.md#alert-response
      - alert: AtepModuleDegraded
        expr: atep_registered_modules{status="degraded"} > 0
        for: 5m
        labels:
          severity: warning
          service: atep-registry
        annotations:
          summary: One or more monitored ATEP modules report degraded health
          runbook_url: docs/observability.md#alert-response
      - alert: AtepModuleLeaseAtRisk
        expr: atep_module_at_risk_leases > 0
        for: 1m
        labels:
          severity: warning
          service: atep-registry
        annotations:
          summary: One or more ATEP module leases are near expiry
          runbook_url: docs/observability.md#alert-response
      - alert: AtepOutboxBacklogOld
        expr: atep_outbox_oldest_unpublished_age_seconds > 60
        for: 5m
        labels:
          severity: critical
          service: atep-outbox-worker
        annotations:
          summary: The oldest unpublished ATEP outbox event is more than 60 seconds old
          runbook_url: docs/observability.md#alert-response
      - alert: AtepOutboxWorkerDown
        expr: (up{job="atep-outbox-worker"} == 0) or (atep_outbox_worker_up == 0)
        for: 2m
        labels:
          severity: critical
          service: atep-outbox-worker
        annotations:
          summary: The ATEP outbox worker is unreachable or unable to complete publication cycles
          runbook_url: docs/observability.md#alert-response
      - alert: AtepOutboxPublicationErrors
        expr: increase(atep_outbox_publication_attempts_total{outcome="error"}[5m]) > 0
        for: 1m
        labels:
          severity: critical
          service: atep-outbox-worker
        annotations:
          summary: The ATEP outbox worker failed to publish one or more events
          runbook_url: docs/observability.md#alert-response
      - alert: AtepTestSchedulerBacklogOld
        expr: atep_test_job_oldest_due_age_seconds > 60
        for: 5m
        labels:
          severity: warning
          service: atep-test-scheduler
        annotations:
          summary: A due ATEP test job has waited more than 60 seconds for dispatch
          runbook_url: docs/observability.md#alert-response
      - alert: AtepTestSchedulerErrors
        expr: increase(atep_test_scheduler_errors_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
          service: atep-test-scheduler
        annotations:
          summary: The ATEP test scheduler encountered a dispatch-cycle failure
          runbook_url: docs/observability.md#alert-response
      - alert: AtepLiveUpdatePublishErrors
        expr: increase(atep_test_run_live_publish_attempts_total{outcome="error"}[5m]) > 0
        for: 1m
        labels:
          severity: warning
          service: atep-test-run-live
        annotations:
          summary: ATEP could not publish one or more test-run live updates to Redis
          runbook_url: docs/observability.md#alert-response
      - alert: AtepDependencyUnavailable
        expr: atep_dependency_ready == 0
        for: 2m
        labels:
          severity: critical
          service: atep-dependencies
        annotations:
          summary: An ATEP runtime dependency is persistently unavailable
          runbook_url: docs/observability.md#alert-response
      - alert: AtepArtifactStoreOperationErrors
        expr: increase(atep_artifact_store_operations_total{outcome="error"}[5m]) > 0
        for: 1m
        labels:
          severity: warning
          service: atep-artifact-store
        annotations:
          summary: The ATEP artifact store reported one or more operation failures
          runbook_url: docs/observability.md#alert-response
      - alert: AtepArtifactStoreLowFreeSpace
        expr: (atep_artifact_store_free_bytes / clamp_min(atep_artifact_store_capacity_bytes, 1)) < 0.1
        for: 10m
        labels:
          severity: warning
          service: atep-artifact-store
        annotations:
          summary: Artifact-store free capacity is below ten percent
          runbook_url: docs/observability.md#alert-response
