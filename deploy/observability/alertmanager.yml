global:
  resolve_timeout: 5m

route:
  receiver: local-webhook
  group_by: [alertname, service, severity]
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: local-webhook
      matchers:
        - severity="critical"
      group_wait: 0s
      group_interval: 10s
      repeat_interval: 1h
    - receiver: local-webhook
      matchers:
        - severity="warning"
      group_wait: 5s
      group_interval: 5m
      repeat_interval: 4h

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: [service]

receivers:
  - name: local-webhook
    webhook_configs:
      - url: http://alert-webhook:8080/api/v1/alerts
        send_resolved: true
        max_alerts: 50
