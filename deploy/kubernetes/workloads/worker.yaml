apiVersion: apps/v1
kind: Deployment
metadata:
  name: atep-outbox-worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: atep-outbox-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: atep-outbox-worker
        app.kubernetes.io/part-of: atep
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9101"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: atep-outbox-worker
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: atep-core
          imagePullPolicy: IfNotPresent
          args: ["python", "-m", "atep.events.worker"]
          envFrom:
            - configMapRef:
                name: atep-runtime-config
            - secretRef:
                name: atep-runtime-secrets
          ports:
            - name: metrics
              containerPort: 9101
          startupProbe:
            tcpSocket:
              port: metrics
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            tcpSocket:
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
