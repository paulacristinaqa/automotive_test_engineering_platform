apiVersion: batch/v1
kind: Job
metadata:
  name: atep-migrate
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: atep-migration
        app.kubernetes.io/part-of: atep
    spec:
      restartPolicy: Never
      serviceAccountName: atep-migration
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migration
          image: atep-core
          imagePullPolicy: IfNotPresent
          args: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: atep-runtime-config
            - secretRef:
                name: atep-runtime-secrets
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
