apiVersion: v1
kind: ConfigMap
metadata:
  name: atep-runtime-config
data:
  ATEP_ENVIRONMENT: production
  ATEP_LOG_LEVEL: INFO
  ATEP_ACCESS_TOKEN_MINUTES: "15"
  ATEP_REFRESH_TOKEN_DAYS: "30"
  ATEP_RATE_LIMIT_ENABLED: "true"
  ATEP_AUTH_RATE_LIMIT_REQUESTS: "5"
  ATEP_AUTH_RATE_LIMIT_IP_REQUESTS: "20"
  ATEP_AUTH_RATE_LIMIT_WINDOW_SECONDS: "60"
  ATEP_API_RATE_LIMIT_REQUESTS: "300"
  ATEP_API_RATE_LIMIT_WINDOW_SECONDS: "60"
  ATEP_MODULE_RECONCILIATION_ENABLED: "true"
  ATEP_MODULE_RECONCILIATION_INTERVAL_SECONDS: "15"
  ATEP_MODULE_AVAILABILITY_SLO_TARGET: "0.99"
  ATEP_MODULE_LEASE_WARNING_SECONDS: "30"
  ATEP_WORKLOAD_IDENTITY_ENABLED: "false"
  ATEP_WORKLOAD_IDENTITY_TRUST_DOMAIN: atep.local
  ATEP_WORKLOAD_IDENTITY_TRUSTED_PROXY_CIDRS: ""
  ATEP_TEST_SCHEDULER_ENABLED: "true"
  ATEP_TEST_SCHEDULER_INTERVAL_SECONDS: "5"
  ATEP_TEST_SCHEDULER_BATCH_SIZE: "20"
  ATEP_TEST_ARTIFACT_STORAGE_PATH: /var/lib/atep/artifacts
  ATEP_TEST_ARTIFACT_MAX_BYTES: "26214400"
  ATEP_METRICS_ENABLED: "true"
  ATEP_TRACING_ENABLED: "false"
  ATEP_OTEL_SERVICE_NAME: atep-core
  ATEP_OTEL_TRACE_SAMPLE_RATIO: "0.1"
  ATEP_OUTBOX_METRICS_PORT: "9101"
  ATEP_OUTBOX_RETRY_SECONDS: "1"
