proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header Forwarded "";
proxy_set_header X-Forwarded-Client-Cert "";
# Test-only evidence: don't trust any upstream-supplied copy of this header.
proxy_hide_header X-Atep-Acceptance-Upstream;
add_header X-Atep-Acceptance-Upstream $upstream_addr always;
proxy_buffering off;
proxy_cache off;
proxy_connect_timeout 5s;
proxy_read_timeout 45s;
proxy_send_timeout 10s;
